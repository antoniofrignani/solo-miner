[package]
name = "solo-miner"
version = "0.5.2"
edition = "2024"
description = "Open-source Bitcoin solo mining menu bar app for macOS"
license = "MIT"

[dependencies]
anyhow = "1"
directories = "6"
serde = { version = "1", features = ["derive"] }
toml = "0.9"
tempfile = "3"
bitcoin = "0.32"
serde_json = "1"
hex = "0.4"
num-bigint = "0.4"
num-traits = "0.2"

[target.'cfg(target_os = "macos")'.dependencies]
libc = "0.2"
eframe = { version = "0.33", default-features = false, features = ["glow", "default_fonts", "accesskit"] }
winit = "0.30"
tray-icon = "0.21"
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-app-kit = { version = "0.3", default-features = false, features = ["NSApplication", "NSWindow", "NSResponder", "NSAlert", "NSButton", "NSControl", "NSView", "NSRunningApplication"] }
objc2-metal = "0.3"
objc2-user-notifications = "0.3"
block2 = "0.6"

[profile.release]
lto = "thin"
strip = true
