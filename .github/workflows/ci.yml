name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: build-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS Apple Silicon
            os: macos-15
            artifact: solo-miner-macos-arm64
          - name: macOS Intel
            os: macos-15-intel
            artifact: solo-miner-macos-x86_64
          - name: Linux configuration CLI
            os: ubuntu-24.04
            artifact: solo-miner-config-linux-x86_64
          - name: Windows configuration CLI
            os: windows-2025
            artifact: solo-miner-config-windows-x86_64
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          components: rustfmt, clippy
      - name: Check formatting
        run: cargo fmt --check
      - name: Lint
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked
      - name: Build release
        run: cargo build --locked --release
      - name: Check configuration command
        run: |
          if [[ "$RUNNER_OS" == Windows ]]; then
            target/release/solo-miner.exe --check
          else
            target/release/solo-miner --check
          fi
      - name: Package
        env:
          ARTIFACT: ${{ matrix.artifact }}
        run: |
          set -euo pipefail
          if [[ "$RUNNER_OS" == macOS ]]; then
            sh scripts/bundle.sh
            codesign --verify --strict 'dist/Solo Miner.app'
            ditto -c -k --sequesterRsrc --keepParent 'dist/Solo Miner.app' "dist/$ARTIFACT.zip"
          else
            mkdir -p dist/package
            cp LICENSE README.md dist/package/
            if [[ "$RUNNER_OS" == Windows ]]; then
              cp target/release/solo-miner.exe dist/package/
              (cd dist/package && 7z a "../$ARTIFACT.zip" .)
            else
              cp target/release/solo-miner dist/package/
              tar -czf "dist/$ARTIFACT.tar.gz" -C dist/package .
            fi
          fi
          (cd dist && if [[ "$RUNNER_OS" == macOS ]]; then
            shasum -a 256 "$ARTIFACT.zip" > "$ARTIFACT.sha256"
          elif [[ "$RUNNER_OS" == Windows ]]; then
            sha256sum "$ARTIFACT.zip" > "$ARTIFACT.sha256"
          else
            sha256sum "$ARTIFACT.tar.gz" > "$ARTIFACT.sha256"
          fi)
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            dist/*.zip
            dist/*.tar.gz
            dist/*.sha256
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          path: dist
          merge-multiple: true
      - name: Verify version
        env:
          TAG: ${{ github.ref_name }}
        run: |
          python3 - <<'PY'
          import os, tomllib
          with open('Cargo.toml', 'rb') as source:
              version = tomllib.load(source)['package']['version']
          assert os.environ['TAG'] == f'v{version}', 'Tag and Cargo.toml version differ'
          PY
      - name: Publish archives and checksums
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: gh release create "$TAG" dist/* --verify-tag --generate-notes --title "$TAG"
